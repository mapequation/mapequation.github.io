name: PR preview

# Each pull request from this repo gets a preview of the site on surge.sh, rebuilt on every push, and a
# comment with its link: https://mapequation-mapequation-github-io-preview-pr-<number>.surge.sh (the
# dots in the repo name become dashes, and the job name is part of it). The preview is torn down when
# the pull request closes. Pull requests from forks don't get one: their runs can't read the
# SURGE_TOKEN secret.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

# A newer push replaces a deploy still running; a close tears down after it.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The static export is served from the root of its surge domain, as on mapequation.org.
      - uses: afc163/surge-preview@v1.13.0
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          dist: out
          teardown: "true"
          failOnError: "true"
          build: |
            npm ci
            npm run build
