<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/navigator/" />
    <link rel="canonical" href="/navigator/" />
    <title>Redirecting to Network Navigator</title>
    <script>
      window.location.replace("/navigator/" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p><a href="/navigator/">Continue to Network Navigator</a></p>
  </body>
</html>
